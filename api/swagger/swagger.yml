openapi: 3.0.0
info:
  title: Viblooop API
  version: 1.0.0
  description: API docs for Viblooop

servers:
  - url: http://localhost:3000

paths:
  /api/getAllEvents:
    get:
      summary: Get all events
      tags: [Events]
      responses:
        200:
          description: OK
          content:
            application/json:
              examples:
                getAllEventsResponse:
                  $ref: '#/components/examples/GetAllEventsResponse'
        500:
          description: Error
          content:
            application/json:
              examples:
                genericError:
                  $ref: '#/components/examples/GenericError'

  /api/getAllEvents/{categoryId}:
    get:
      summary: Get all events by category
      tags: [Events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            example:
              categoryId: "68890057a63ecb4cb60cc585"
      responses:
        200:
          description: OK
          content:
            application/json:
              examples:
                getAllEventsResponse:
                  $ref: '#/components/examples/GetAllEventsResponse'
        500:
          description: Error
          content:
            application/json:
              examples:
                genericError:
                  $ref: '#/components/examples/GenericError'

components:
  examples:
    GetAllEventsResponse:
      value:
        statusCode: 200
        success: true
        message: "Events fetched successfully"
        data: [
                {
                  _id: "68890099ed9f2a6279d47392",
                  title: "Everest Base Camp Trek",
                  description:
                    "A once-in-a-lifetime trekking adventure to Everest Base Camp.",
                  image:
                    "https://images.unsplash.com/photo-1500048993957-9269167dafa0?q=80&w=1170",
                  dateTime: "2025-09-10T08:00:00.000Z",
                  timezone: "Asia/Kathmandu",
                  location: "Lukla",
                  attendeeLimit: 15,
                  currentAttendees: 0,
                  cost: "Paid",
                  tags: [],
                  gallery: [],
                  organizer: "68890057a63ecb4cb60cc585",
                  category: "68890099ed9f2a6279d4738b",
                  createdAt: "2025-07-29T17:10:49.672Z",
                  updatedAt: "2025-07-29T17:10:49.672Z",
                }
            ]
    GenericError:
      value:
        statusCode: 500
        success: false
        message: "Internal Server Error"
        data: null
        errors:
          message: "Something went wrong"
