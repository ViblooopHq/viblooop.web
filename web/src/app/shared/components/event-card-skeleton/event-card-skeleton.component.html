@for (item of items(); track item) {
  <!-- Desktop Card Skeleton (>= 641px) -->
  <div class="vl-card-desktop">
    <div class="vl-event-card-skeleton">
      <div class="vl-event-card-skeleton__media vl-shimmer"></div>
      <div class="vl-event-card-skeleton__body">
        <div class="vl-event-card-skeleton__line vl-event-card-skeleton__line--title vl-shimmer"></div>
        <div class="vl-event-card-skeleton__line vl-event-card-skeleton__line--subtitle vl-shimmer"></div>
        <div class="vl-event-card-skeleton__line vl-event-card-skeleton__line--host vl-shimmer"></div>
        <div class="vl-event-card-skeleton__footer">
          <div class="vl-event-card-skeleton__line vl-event-card-skeleton__line--price vl-shimmer"></div>
          <div class="vl-event-card-skeleton__line vl-event-card-skeleton__line--meta vl-shimmer"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Compact Card Skeleton (< 640px) -->
  <div class="vl-card-mobile">
    <div class="vl-compact-card-skeleton">
      <div class="vl-compact-card-skeleton__media vl-shimmer"></div>
      <div class="vl-compact-card-skeleton__body">
        <div class="vl-compact-card-skeleton__date vl-shimmer"></div>
        <div class="vl-compact-card-skeleton__title vl-shimmer"></div>
        <div class="vl-compact-card-skeleton__title-short vl-shimmer"></div>
        <div class="vl-compact-card-skeleton__location vl-shimmer"></div>
        <div class="vl-compact-card-skeleton__footer">
          <div class="vl-compact-card-skeleton__price vl-shimmer"></div>
          <div class="vl-compact-card-skeleton__spots vl-shimmer"></div>
        </div>
      </div>
    </div>
  </div>
}
