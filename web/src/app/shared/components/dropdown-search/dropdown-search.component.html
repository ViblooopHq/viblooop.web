<div class="space-y-4">
  <!-- Selected Chips -->
  @if (selectedInterests.length > 0) {
    <div>
      <label class="block text-sm font-medium text-gray-900 mb-1">
        Selected Interests
      </label>
      <div class="flex flex-wrap gap-2">
        @for (selected of selectedInterests; track selected) {
          <span
            class="bg-blue-600 text-white px-3 py-1 rounded-full flex items-center gap-2 text-sm">
            {{ selected }}
            <button type="button" (click)="toggleInterest(selected)" class="hover:text-gray-200">
              ✕
            </button>
          </span>
        }
      </div>
    </div>
  }

  <!-- Available Chips -->
  <div>
    <label class="block text-sm font-medium text-gray-900 mb-1">
      Choose Your Interests
    </label>
    <div class="flex flex-wrap gap-2">
      @for (interest of allInterests; track interest) {
<span (click)="toggleInterest(interest)" class="cursor-pointer px-4 py-1.5 rounded-full border text-sm font-medium transition
         hover:shadow-md hover:scale-105 active:scale-95
         border-gray-300 text-gray-700
         hover:bg-blue-50" [class.bg-blue-600]="selectedInterests.includes(interest)"
          [class.text-white]="selectedInterests.includes(interest)"
          [class.border-blue-600]="selectedInterests.includes(interest)"
          [class.shadow-sm]="selectedInterests.includes(interest)">
          {{ interest }}
        </span>
      }

    </div>
  </div>
</div>
