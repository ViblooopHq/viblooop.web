<div
  class="event-created-overlay"
  role="status"
  aria-live="polite"
  aria-label="Event created"
  (click)="onBackdropClick()">
  <div class="event-created-overlay__content" (click)="$event.stopPropagation()">
    <ng-lottie
      [options]="animationOptions"
      width="220px"
      height="220px">
    </ng-lottie>
    <p class="event-created-overlay__title">Event created!</p>
    <p class="event-created-overlay__subtitle">Your vibe is live.</p>
    <div class="event-created-overlay__actions">
      <button type="button" class="event-created-overlay__button event-created-overlay__button--secondary"
        (click)="done.emit()">
        Done
      </button>
      <button type="button" class="event-created-overlay__button event-created-overlay__button--primary"
        (click)="viewEvent.emit()">
        View Event
      </button>
    </div>
  </div>
</div>
