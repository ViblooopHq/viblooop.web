<div class="vl-stepper flex items-center justify-center space-x-4 mb-8">
    @for(step of totalSteps; track step; let i = $index) {
      <div class="flex items-center">
        <div
          class="vl-stepper-circle flex items-center justify-center w-10 h-10 rounded-full font-semibold transition-all duration-300 cursor-pointer"
          [class.bg-gradient-to-r]="i <= currentStep"
          [class.from-pink-500]="i <= currentStep"
          [class.to-blue-500]="i <= currentStep"
          [class.bg-gray-200]="i > currentStep"
          [class.text-white]="i <= currentStep"
          [class.text-gray-600]="i > currentStep"
          (click)="goToStep(i)"
        >
          {{ i + 1 }}
        </div>
  
        @if (i < totalSteps.length - 1) {
          <div
            class="vl-stepper-line w-14 h-[2px] mx-2"
            [ngClass]="{
              'bg-gradient-to-r from-pink-500 to-blue-500': i < currentStep,
              'bg-gray-300': i >= currentStep
            }"
          ></div>
        }
      </div>
    }
</div>
