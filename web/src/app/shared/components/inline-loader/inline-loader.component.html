<span
  class="vl-inline-loader"
  [class.vl-inline-loader--xs]="size() === 'xs'"
  [class.vl-inline-loader--sm]="size() === 'sm'"
  [class.vl-inline-loader--md]="size() === 'md'"
  [class.vl-inline-loader--lg]="size() === 'lg'"
  [class.vl-inline-loader--primary]="color() === 'primary'"
  [class.vl-inline-loader--white]="color() === 'white'"
  [class.vl-inline-loader--light]="color() === 'light'"
  [class.vl-inline-loader--current]="color() === 'current'"
  role="status"
  aria-live="polite">
  
  @if (variant() === 'spinner') {
    <svg class="vl-inline-loader__spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle class="vl-inline-loader__track" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" />
      <path
        class="vl-inline-loader__head"
        d="M12 3a9 9 0 0 1 9 9"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round" />
    </svg>
  } @else if (variant() === 'dots') {
    <span class="vl-inline-loader__dots" aria-hidden="true">
      <span class="vl-inline-dot"></span>
      <span class="vl-inline-dot"></span>
      <span class="vl-inline-dot"></span>
    </span>
  } @else if (variant() === 'pulse') {
    <span class="vl-inline-loader__pulse" aria-hidden="true"></span>
  }

  @if (text()) {
    <span class="vl-inline-loader__text">{{ text() }}</span>
  }
</span>
