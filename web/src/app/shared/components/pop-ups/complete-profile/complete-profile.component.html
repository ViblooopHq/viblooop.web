<!-- Overlay -->
<div
  class="fixed inset-0 flex items-center justify-center bg-white/60 backdrop-blur-sm z-[1000] transition-opacity"
  style="pointer-events: all; overflow: hidden;"
>
  <!-- Block page scroll -->
  <div
    class="p-[2px] rounded-2xl bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 shadow-xl max-w-md w-full mx-4"
    (click)="$event.stopPropagation()"
  >
    <!-- Actual Modal Content -->
    <div class="bg-white rounded-2xl p-6 text-center">
      <!-- Optional illustration -->
      <div class="flex justify-center mb-4">
        <ng-lottie [options]="options"></ng-lottie>
      </div>

      <!-- Heading -->
      <h2 class="text-2xl font-bold text-gray-800 mb-2">
        {{ title }}
      </h2>

      <!-- Description -->
      <p class="text-sm text-gray-600 mb-6">
        {{ description }}
      </p>

      <!-- Buttons -->
      <div class="flex flex-col sm:flex-row justify-center gap-3">
        <button
          class="vl-btn bg-gray-100 text-gray-700 hover:bg-gray-200 sm:flex-1"
          (click)="later()"
        >
          Later
        </button>

        <button
          class="vl-btn bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 text-white hover:opacity-90 sm:flex-1"
          (click)="completeNow()"
        >
          Complete Now
        </button>
      </div>
    </div>
  </div>
</div>
