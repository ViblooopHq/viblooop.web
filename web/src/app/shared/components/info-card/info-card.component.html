<article class="vl-info-card vl-section-wrapper" [style.height]="height" [style.width]="width">
    <div class="vl-info-card__icon-wrapper" [style.color]="cardData.color">
      <i class="vl-info-card__icon" [className]="cardData.icon"></i>
    </div>
    <h2>{{ cardData.title }}</h2>
    <p>{{ cardData.description }}</p>
</article>
