<button type="button" class="vl-form-drawer__close" aria-label="Close drawer" (click)="closeDrawer()">
  <span class="material-symbols-outlined" translate="no">close</span>
</button>

<section
  class="vl-form-drawer"
  [class.vl-form-drawer--closing]="isClosing"
  [attr.aria-label]="ariaLabel">
  <div class="vl-form-drawer__handle" aria-hidden="true"></div>
  <ng-content></ng-content>
</section>
