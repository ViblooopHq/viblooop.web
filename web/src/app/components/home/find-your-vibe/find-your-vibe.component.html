<section class="vl-categories vl-section-wrapper">
  <vl-section-headers [label]="label" [title]="title" [description]="description"></vl-section-headers>

  <div class="vl-categories__grid">
    @for (category of eventCategories; track category._id; let i = $index) {
    <div class="vl-categories__card" [ngClass]="{
          'vl-categories__card--featured': i % 4 === 0,
          'vl-categories__card--wide': i % 4 === 3
        }" (click)="goToEventCategory('/eventCategories', category._id); setActiveEventCategory(category)"
      role="button" tabindex="0">

      <img class="vl-categories__image" [src]="category.image" [alt]="category.title">

      <div class="vl-categories__overlay"></div>

      <div class="vl-categories__content">
        <span class="material-symbols-outlined vl-categories__icon" translate="no">{{ getMaterialIcon(category.icon) }}</span>
        <h3 class="vl-categories__title" i18n>{{category.title}}</h3>
      </div>
    </div>
    } @empty {
    <div class="vl-categories__empty">
      <p i18n>Keeping patience, data is loading...</p>
    </div>
    }
  </div>
</section>
