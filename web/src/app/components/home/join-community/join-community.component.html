<section class="vl-community">
  <div class="vl-community__container">

    <vl-section-headers [label]="'Community'" [title]="'Join a Trusted Community'"
      [description]="'At Viblooop, we prioritize your safety and experience. Connect with confidence and make real memories.'">
    </vl-section-headers>

    <div class="vl-community__grid">
      @for (card of trustedCardData; track card.title; let i = $index) {
      <article class="vl-community__card vl-surface vl-surface--interactive" [ngClass]="{
            'vl-community__card--primary': i === 0,
            'vl-community__card--secondary': i === 1,
            'vl-community__card--tertiary': i === 2,
            'vl-community__card--accent': i === 3
          }">

        <div class="vl-community__icon-wrapper">
          <span class="material-symbols-outlined vl-community__icon" translate="no">{{ card.materialIcon }}</span>
        </div>

        <h3 class="vl-community__card-title">{{ card.title }}</h3>
        <p class="vl-community__card-desc">{{ card.description }}</p>
      </article>
      }
    </div>
  </div>
</section>
