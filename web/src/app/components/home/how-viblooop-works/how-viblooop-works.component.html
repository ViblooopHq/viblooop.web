<section class="vl-how-works">
  <div class="vl-how-works__container">

    <vl-section-headers [label]="'Getting Started'" [title]="'How Viblooop Works'"
      [description]="'Join the movement in 3 simple steps and unlock a world of shared experiences.'">
    </vl-section-headers>

    <div class="vl-how-works__grid">
      @for (card of infoCards; track card.title; let i = $index) {
      <article class="vl-how-works__card" [ngClass]="{
            'vl-how-works__card--primary': i === 0,
            'vl-how-works__card--secondary': i === 1,
            'vl-how-works__card--tertiary': i === 2
          }">

        <div class="vl-how-works__step">
          <span class="vl-how-works__step-number">0{{ i + 1 }}</span>
        </div>

        <div class="vl-how-works__icon-wrapper">
          <span class="material-symbols-outlined vl-how-works__icon" translate="no">{{ card.materialIcon }}</span>
        </div>

        <h3 class="vl-how-works__card-title">{{ card.title }}</h3>
        <p class="vl-how-works__card-desc">{{ card.description }}</p>
      </article>
      }
    </div>
  </div>
</section>
