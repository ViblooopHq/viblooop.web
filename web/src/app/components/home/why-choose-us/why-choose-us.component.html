<section class="vl-edge">
    <div class="vl-edge__container">

        <vl-section-headers [label]="'Why choose viblooop'" [title]="'The Viblooop Edge'"
            [description]="'Why thousands choose our platform to host and discover world-class experiences.'"></vl-section-headers>

        <div class="vl-edge__grid">

            <article class="vl-edge__card vl-edge__card--primary vl-surface vl-surface--interactive">
                <div class="vl-edge__icon-wrapper">
                    <span class="material-symbols-outlined vl-edge__icon" translate="no">verified_user</span>
                </div>
                <h3 class="vl-edge__card-title">Vetted Safety</h3>
                <p class="vl-edge__card-desc">
                    Every event and host is verified by our community trust protocol.
                </p>
            </article>

            <article class="vl-edge__card vl-edge__card--secondary vl-surface vl-surface--interactive">
                <div class="vl-edge__icon-wrapper">
                    <span class="material-symbols-outlined vl-edge__icon" translate="no">bolt</span>
                </div>
                <h3 class="vl-edge__card-title">Instant Access</h3>
                <p class="vl-edge__card-desc">
                    Booking and ticketing happen in milliseconds, not minutes.
                </p>
            </article>

            <article class="vl-edge__card vl-edge__card--tertiary vl-surface vl-surface--interactive">
                <div class="vl-edge__icon-wrapper">
                    <span class="material-symbols-outlined vl-edge__icon" translate="no">diversity_3</span>
                </div>
                <h3 class="vl-edge__card-title">Global Network</h3>
                <p class="vl-edge__card-desc">
                    Connect with a global community of explorers and creators.
                </p>
            </article>

        </div>
    </div>
</section>
