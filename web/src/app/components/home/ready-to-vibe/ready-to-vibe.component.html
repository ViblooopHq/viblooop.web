<section class="vl-cta">
  <div class="vl-cta__glow vl-cta__glow--left"></div>
  <div class="vl-cta__glow vl-cta__glow--right"></div>

  <div class="vl-cta__container">
    <vl-section-headers [label]="'Ready?'" [title]="'Ready to Vibe?'"
      [description]="'Don\'t just scroll, connect! Thousands are already finding their crew and creating unforgettable moments.'">
    </vl-section-headers>

    <p class="vl-cta__tagline" i18n>Someone's already waiting to share a vibe with you!</p>

    <div class="vl-cta__actions">
      <button class="vl-cta__btn vl-cta__btn--primary" i18n>Join the Vibe</button>
      <button class="vl-cta__btn vl-cta__btn--glass" i18n>Learn More</button>
    </div>
  </div>
</section>
