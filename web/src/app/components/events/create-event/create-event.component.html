<vl-form-drawer [ariaLabel]="formService.isEditMode() ? 'Edit event' : 'Create event'">
@if (isEventCreatedOverlayVisible()) {
  <vl-event-created-overlay
    [animationPath]="formService.eventCreatedAnimationPath()"
    (done)="finishEventCreation()"
    (viewEvent)="viewCreatedEvent()">
  </vl-event-created-overlay>
} @else {
  <vl-create-event-header
    [steps]="totalSteps"
    [currentStep]="currentStep()"
    [title]="currentStepTitle()"
    [subtitle]="currentStepSubtitle()"
    [showBack]="currentStep() > 0"
    (back)="prevStep()" />

  <form class="create-form">
    @switch (currentStep()) {
      @case (0) {
        <vl-step-vibe (categorySelected)="onCategorySelected()" />
      }
      @case (1) {
        <vl-step-essentials (next)="nextStep()" />
      }
      @case (2) {
        <vl-step-scene (next)="nextStep()" />
      }
      @case (3) {
        <vl-step-review
          [isSubmittingEvent]="isSubmittingEvent()"
          (editScene)="currentStep.set(2)"
          (launch)="submitForm()" />
      }
    }
  </form>
}
</vl-form-drawer>
