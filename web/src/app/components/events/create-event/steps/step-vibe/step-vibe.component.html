<main class="step-content">
  <div class="vibe-grid">
    @for (cat of categories(); track categoryKey(cat)) {
      <vl-vibe-category-card
        [category]="cat"
        [selected]="selectedCategoryId() === categoryKey(cat)"
        (select)="select(categoryKey(cat))" />
    }

    <!-- Custom option (Disabled - not supported yet) -->
    <button
      type="button"
      class="vibe-card vibe-card--custom vibe-card--disabled"
      disabled
      aria-disabled="true"
      title="Custom vibe is currently not supported">
      <div class="vibe-custom-mark">
        <span class="material-symbols-outlined" aria-hidden="true">auto_awesome</span>
      </div>
      <span class="vibe-label">Custom</span>
      <span class="vibe-tags">Coming Soon</span>
    </button>
  </div>
</main>
