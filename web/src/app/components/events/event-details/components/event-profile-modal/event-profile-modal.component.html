@if (isOpen()) {
<div class="fixed inset-0 z-[999] flex items-center justify-center bg-black/60 backdrop-blur-sm">
  <div class="bg-surface text-primary border border-border rounded-2xl shadow-2xl w-[95%] max-w-3xl max-h-[90vh] p-6 relative overflow-y-auto" role="dialog"
    aria-modal="true" aria-labelledby="event-profile-modal-heading" cdkTrapFocus cdkTrapFocusAutoCapture
    (keydown.escape)="close.emit()">
    <button type="button" (click)="close.emit()" aria-label="Close profile"
      class="absolute top-4 right-4 text-secondary hover:text-primary transition-colors">
      <i class="fa-solid fa-xmark text-xl" aria-hidden="true"></i>
    </button>
    <h2 id="event-profile-modal-heading" class="text-xl font-bold mb-4 text-primary">User Profile</h2>
    @if (userId()) {
      <vl-profile [userId]="userId()"></vl-profile>
    }
  </div>
</div>
}
