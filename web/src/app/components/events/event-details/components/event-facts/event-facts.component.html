<section class="ed-section event-facts">
  <h2 class="sr-only">Event details</h2>
  <div class="info-rows">
    <div class="info-row">
      <i class="fa-regular fa-calendar" aria-hidden="true"></i>
      <span>{{ isEscapeEvent() ? tripDateRangeLabel() : (eventDate() | date:'EEEE, d MMMM y') }}</span>
    </div>
    @if (!isEscapeEvent()) {
    <div class="info-row">
      <i class="fa-regular fa-clock" aria-hidden="true"></i>
      <span>{{ eventTime() }} onwards</span>
    </div>
    }
    <div class="info-row">
      <i class="fa-solid fa-ticket" aria-hidden="true"></i>
      <span><strong>{{ eventPriceLabel() }}</strong> per person</span>
    </div>
    <div class="info-row">
      <i [class]="audiencePreferenceIcon()" aria-hidden="true"></i>
      <span>{{ audiencePreferenceLabel() }}</span>
    </div>
    <div class="info-row">
      <i class="fa-solid fa-users" aria-hidden="true"></i>
      <span>{{ totalAttendeesCount() }} spots booked <span class="dot" aria-hidden="true">•</span> {{ remainingSpotsLabel() }}</span>
    </div>
  </div>
</section>
