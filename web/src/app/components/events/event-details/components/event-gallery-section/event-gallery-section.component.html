@if (images().length > 0) {
<section class="ed-section">
  <h2 class="ed-section-title">Event Gallery</h2>
  <div class="gallery-scroll">
    @for (galleryImage of images(); track galleryImage.path; let i = $index) {
    <button type="button" class="gallery-item" [attr.aria-label]="'Photo ' + (i + 1) + ' of event gallery'" (click)="openPreview(i)">
      <img [src]="galleryImage.url" alt="">
    </button>
    }
  </div>
  @if (isEventCreator()) {
  <label for="photoUploadInput" class="sr-only">Upload event photos</label>
  <input #photoUploadInput id="photoUploadInput" type="file" accept="image/*,.heic,.heif" multiple (change)="onFilesSelected($event)" hidden />
  <button type="button" class="btn-upload vl-button vl-button--secondary" (click)="triggerUpload()" [disabled]="isUploading()">
    @if (isUploading()) {
      <vl-inline-loader size="sm" color="primary" text="Uploading..."></vl-inline-loader>
    } @else {
      <i class="fa-solid fa-camera" aria-hidden="true"></i>
      <span>Upload Photos</span>
    }
  </button>
  }
</section>
}

<vl-gallery class="event-gallery-preview" [images]="images()" [showHeader]="false" [showGrid]="false"
  [showArchiveAction]="false" [showActions]="true" [canDownload]="canDownload()" [canDelete]="isEventCreator()"
  [deletingImagePath]="deletingImagePath()" (deleteImage)="onDeleteImage($event)">
</vl-gallery>
