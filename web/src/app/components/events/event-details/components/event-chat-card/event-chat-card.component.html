<section class="ed-section chat-card">
  <button type="button" class="btn-chat vl-button vl-button--secondary vl-button--block" (click)="toggleChat.emit()" [attr.aria-expanded]="isChatOpen()">
    <i class="fa-regular fa-comments" aria-hidden="true"></i>
    <span class="chat-copy">
      <span class="chat-title-row">
        <strong>Event Chat</strong>
        <small>{{ totalAttendeesCount() }}</small>
      </span>
      <span class="chat-subtitle">Keep in touch with attendees</span>
    </span>
    <span class="chat-action">{{ isChatOpen() ? 'Close Chat' : 'Open Chat' }}</span>
  </button>
</section>
