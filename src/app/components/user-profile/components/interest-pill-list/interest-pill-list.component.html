@for (interest of displayedInterests; track $index) {
  <vl-pill
    [label]="getInterestLabel(interest)"
    [size]="size()">
  </vl-pill>
}

@if (extraCount() > 0) {
  <button
    class="vl-pill-extra"
    type="button"
    [attr.aria-expanded]="expanded()"
    (click)="toggleExpanded()">
    {{ expanded() ? 'Show less' : '+' + extraCount() + ' more' }}
  </button>
}
