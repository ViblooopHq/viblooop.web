<section
  class="vl-user-profile__photo-verification"
  [class.vl-user-profile__photo-verification--verified]="isVerified()"
  aria-label="Photo verification">
  <span class="vl-user-profile__photo-verification-icon" aria-hidden="true">
    <span class="material-symbols-outlined" translate="no">verified_user</span>
  </span>

  <span class="vl-user-profile__photo-verification-copy">
    <strong>{{ isVerified() ? 'You’re verified' : 'Verify for free' }}</strong>
    <small>{{ isVerified() ? 'Your profile has the verified badge.' : 'Show authenticity to boost trust.' }}</small>

    @if (!isVerified()) {
      <button class="vl-button vl-button--secondary vl-user-profile__photo-verification-action" type="button" (click)="verify.emit()">
        Get verified
      </button>
    }
  </span>

  @if (!isVerified()) {
    <button class="vl-user-profile__photo-verification-dismiss" type="button" (click)="dismiss.emit()" aria-label="Dismiss verification prompt">
      <span class="material-symbols-outlined" translate="no" aria-hidden="true">close</span>
    </button>
  }
</section>
