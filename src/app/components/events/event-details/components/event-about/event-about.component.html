<section class="ed-section about-description">
  <div class="about-header">
    <span class="about-icon-badge">
      <span class="material-symbols-outlined" translate="no">description</span>
    </span>
    <h2 class="ed-section-title">About this Vibe</h2>
  </div>

  @if (description()) {
    <p class="about-body">{{ description() }}</p>
  } @else {
    <p class="about-body about-body--empty">No description provided for this event.</p>
  }

  <!-- Real Event Expectations (if any) -->
  @if (parsedExpectations().length > 0) {
    <div class="about-expectations">
      <h3 class="about-subheading">
        <span class="material-symbols-outlined" translate="no">task_alt</span>
        What to Expect & Guidelines
      </h3>
      <ul class="about-expectations-list">
        @for (item of parsedExpectations(); track item) {
          <li>
            <span class="material-symbols-outlined" translate="no">check_circle</span>
            <span>{{ item }}</span>
          </li>
        }
      </ul>
    </div>
  }

</section>
