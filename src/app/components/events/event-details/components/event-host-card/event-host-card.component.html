<section class="ed-section host-panel" aria-labelledby="host-card-heading">
  <div class="host-summary">
    <button class="host-avatar-button" type="button" (click)="viewProfile.emit()"
      [attr.aria-label]="'View profile of host ' + (host()?.username || 'Host')" matTooltip="View Profile">
      <img class="host-avatar" alt="{{ host()?.username || 'Host' }}'s profile photo"
        [src]="host()?.profileImage ? (host()!.profileImage! | imageUrl) : 'assets/images/default-profile.png'"
        (error)="$any($event.target).src = 'assets/images/default-profile.png'">
    </button>

    <div class="host-summary__content">
      <button class="host-heading-row host-profile-link" type="button" (click)="viewProfile.emit()"
        [attr.aria-label]="'View profile of host ' + (host()?.username || 'Host')">
        <h2 id="host-card-heading" class="host-heading">
          <strong>{{ host()?.username || 'Host' }}</strong>
        </h2>
        @if (host()?.verified) {
          <span class="material-symbols-outlined verified-check" [style.font-variation-settings]="'\'FILL\' 1'" translate="no">verified</span>
        }
      </button>

      <div class="host-trust-row">
        @if (isNewHost()) {
        <span class="host-trust-pill host-trust-pill--new">
          <span class="material-symbols-outlined" [style.font-variation-settings]="'\'FILL\' 1'" translate="no">star</span>
          New Host
        </span>
        } @else if (shouldShowRating()) {
        <span class="host-trust-pill host-trust-pill--rating">
          <span class="material-symbols-outlined" [style.font-variation-settings]="'\'FILL\' 1'" translate="no">star</span>
          {{ hostRating() | number:'1.1-1' }} rating
        </span>
        }
      </div>

      @if (hostEventCount() > 0) {
      <div class="host-proof-item">
        <span class="host-proof-icon">
          <span class="material-symbols-outlined" translate="no">calendar_month</span>
        </span>
        <span>Hosted {{ hostEventCount() }} {{ hostEventCount() === 1 ? 'event' : 'events' }}</span>
      </div>
      }
    </div>
  </div>
</section>
