<div class="duration-picker" vibOutsideClick (onOutsideClick)="isOpen.set(false)">
  <button
    type="button"
    class="duration-trigger"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
    (keydown)="onKeydown($event)">
    <span>{{ selectedLabel() }}</span>
    <span class="material-symbols-outlined duration-chevron" aria-hidden="true">expand_more</span>
  </button>

  @if (isOpen()) {
    <div class="duration-options" role="listbox" aria-label="Hangout duration">
      @for (option of options(); track option.value) {
        <button
          type="button"
          class="duration-option"
          role="option"
          [attr.aria-selected]="value() === option.value"
          [class.active]="value() === option.value"
          (click)="select(option.value)">
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
