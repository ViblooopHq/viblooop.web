@if (!isServer) {
<div class="vl-full-page-carousel-wrapper">
  <swiper-container init="false" #swiperContainer class="vl-full-page-carousel">
    @if (items() && template) {
      @for (item of items(); track $index) {
        <swiper-slide>
          <ng-container *ngTemplateOutlet="template; context: { $implicit: item }"></ng-container>
        </swiper-slide>
      }
    } @else {
      <ng-content></ng-content>
    }
  </swiper-container>
</div>
} @else {
<!-- SSR Fallback grid to prevent layout shift -->
<div class="vl-full-page-ssr-fallback">
  @if (items() && template) {
    @for (item of items(); track $index) {
      <div class="ssr-slide">
        <ng-container *ngTemplateOutlet="template; context: { $implicit: item }"></ng-container>
      </div>
    }
  } @else {
    <ng-content></ng-content>
  }
</div>
}
